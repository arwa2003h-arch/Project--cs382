<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Assignment</title>
    <!-- jQuery and jQuery UI -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <!-- External CSS -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
<div class="dashboard-container">
    <!-- Shared sidebar menu added to match dashboard pages -->
    <aside class="sidebar">
        <div class="logo-box">
            <div class="logo-icon">W</div>
            <h2>Whiteboard</h2>
        </div>

        <ul class="menu">
            <li><a href="teacher_dashboard.html">Teacher Home</a></li>
            <li><a href="task_form.html" class="active">Add Assignment</a></li>
            <li><a href="logout.php">Logout</a></li>
        </ul>
    </aside>

    <!-- Page content -->
    <main class="main-content form-page">
        <div class="container">
            <h2>Add Assignment</h2>

            <form id="taskForm">
                <input type="hidden" id="task_id" name="task_id">

                <label>Title *</label>
                <input type="text" id="title" name="title" required>

                <label>Description</label>
                <textarea id="description" name="description" rows="4"></textarea>

                <label>Deadline *</label>
                <input type="text" id="deadline" name="deadline" placeholder="YYYY-MM-DD" required>

                <label>Course</label>
                <select id="course_id" name="course_id">
                    <option value="">-- Select Course --</option>
                </select>

                <button type="submit" id="saveBtn">Save Task</button>
                <button type="button" id="resetBtn" class="reset">Reset</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </main>
</div>

<script>
$(document).ready(function() {
    // Load course codes from database before add/edit form is used
    $.get('get_courses.php', function(data) {
        if (data.status === 'success') {
            var select = $('#course_id');
            $.each(data.courses, function(i, course) {
                select.append('<option value="' + course.id + '">' + course.name + '</option>');
            });

            var urlParams = new URLSearchParams(window.location.search);
            var taskId = urlParams.get('id');
            if (taskId) {
                loadTaskData(taskId);
            }
        } else {
            $('#message').text('Failed to load courses.').addClass('error');
        }
    }, 'json');

    // jQuery UI DatePicker
    $('#deadline').datepicker({
        dateFormat: 'yy-mm-dd',
        minDate: 0
    });

    // Load selected task data when teacher clicks Edit
    function loadTaskData(id) {
        $.get('get_task.php', { id: id }, function(data) {
            if (data.status === 'success') {
                $('#task_id').val(data.task.id);
                $('#title').val(data.task.title);
                $('#description').val(data.task.description);
                $('#deadline').val(data.task.deadline);
                $('#course_id').val(data.task.course_id);
                $('#message').text('Loaded task for editing').addClass('success').removeClass('error');
            } else {
                $('#message').text(data.message).addClass('error');
            }
        }, 'json');
    }

    // Client-side validation
    function validate() {
        if ($('#title').val().trim() === '') {
            $('#message').text('Title is required').addClass('error');
            return false;
        }
        if ($('#deadline').val() === '') {
            $('#message').text('Deadline is required').addClass('error');
            return false;
        }
        return true;
    }

    // Submit via AJAX (POST)
    $('#taskForm').on('submit', function(e) {
        e.preventDefault();
        if (!validate()) return;

        var formData = {
            task_id: $('#task_id').val(),
            title: $('#title').val(),
            description: $('#description').val(),
            deadline: $('#deadline').val(),
            course_id: $('#course_id').val()
        };

        $.post('save_task.php', formData, function(response) {
            if (response.status === 'success') {
                $('#message').text(response.message).addClass('success').removeClass('error');
                if (!$('#task_id').val()) {
                    $('#taskForm')[0].reset();
                    $('#deadline').val('');
                }
                // Go back to teacher dashboard after saving to show database changes
                setTimeout(function() {
                    window.location.href = 'teacher_dashboard.html';
                }, 1200);
            } else {
                $('#message').text(response.message).addClass('error');
            }
        }, 'json').fail(function() {
            $('#message').text('Server error. Please try again.').addClass('error');
        });
    });

    $('#resetBtn').click(function() {
        $('#taskForm')[0].reset();
        $('#task_id').val('');
        $('#message').empty().removeClass('success error');
    });
});
</script>
</body>
</html>

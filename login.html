<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<div class="dashboard-container">
    <!-- Shared sidebar menu added to match dashboard pages -->
    

    <!-- Page content -->
    <main class="main-content auth-page">
        <div class="container login-box">
            <h2>Welcome<span>Back</span></h2>
            <div class="subtitle">Sign in to continue</div>

            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="pass" placeholder="Password">

            <div class="remember-row">
                <label>
                    <input type="checkbox" id="remember"> Remember Me
                </label>
            </div>

            <button class="btn" id="doLogin">Login</button>

            <div class="message" id="msg"></div>

            <div class="link">
                Don't have an account? <a href="register.html">Create Account</a>
            </div>
        </div>
    </main>
</div>


<script>
$(document).ready(function(){
    // Remember me
    if(localStorage.getItem("remember") == "true"){
        $("#email").val(localStorage.getItem("email"));
        $("#remember").prop("checked", true);
    }

    // Login validation and AJAX
    $("#doLogin").click(function(){
        let email = $("#email").val();
        let pass = $("#pass").val();

        if(email == "" || pass == ""){
            $("#msg").html("Please fill all fields").css("color","red");
            return;
        }

        // Send login data to PHP, then redirect based on user role
        $.ajax({
            url: "login.php",
            type: "POST",
            dataType: "json",
            data: {email: email, password: pass},
            success: function(res){
                if(res.status == "success"){
                    if($("#remember").is(":checked")){
                        localStorage.setItem("email", email);
                        localStorage.setItem("remember", "true");
                    }

                    $("#msg").html(res.message).css("color","green");
                    setTimeout(function(){
                        window.location.href = res.redirect;
                    }, 800);
                } else{
                    $("#msg").html(res.message).css("color","red");
                }
            },
            error: function(){
                $("#msg").html("Connection error").css("color","red");
            }
        });
    });

    // Forgot password popup
    $("#forgotLink").click(function(e){
        e.preventDefault();
        $("#forgotModal").fadeIn();
    });

    $("#closeModal").click(function(){
        $("#forgotModal").fadeOut();
    });

    $(window).click(function(e){
        if($(e.target).is("#forgotModal")){
            $("#forgotModal").fadeOut();
        }
    });

    $("#sendResetBtn").click(function(){
        let email = $("#resetEmail").val();

        if(email == ""){
            $("#resetMsg").html("Please enter your email").css("color","red");
            return;
        }

        if(email.indexOf("@") == -1 || email.indexOf(".") == -1){
            $("#resetMsg").html("Invalid email format").css("color","red");
            return;
        }

        $.ajax({
            url: "forgot_password.php",
            type: "POST",
            data: {email: email},
            success: function(response){
                $("#resetMsg").html("Reset link sent to " + email).css("color","green");
                $("#resetEmail").val("");
                setTimeout(function(){
                    $("#forgotModal").fadeOut();
                    $("#resetMsg").html("");
                }, 2000);
            },
            error: function(){
                $("#resetMsg").html("Connection error").css("color","red");
            }
        });
    });
});
</script>

</body>
</html>
